version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: webhook_relay_postgres
    environment:
      POSTGRES_USER: relay_user
      POSTGRES_PASSWORD: relay_password
      POSTGRES_DB: webhook_relay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay_user -d webhook_relay"]
      interval: 3s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: webhook_relay_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

